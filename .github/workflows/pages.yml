name: Deploy GitHub Pages

on:
  push:
    branches: [public_site]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build site
        working-directory: app
        env:
          GITHUB_PAGES: 'true'
        run: |
          npm ci
          npm run build
          cp -f dist/index.html dist/404.html
          cp -f public/icon.png dist/icon.png 2>/dev/null || cp -f ../icon.png dist/icon.png
          # Publish artifact = built SPA
          mkdir -p ../_site
          cp -R dist/. ../_site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
