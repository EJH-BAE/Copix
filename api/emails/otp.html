<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Copix code</title>
</head>
<body style="margin:0;padding:0;background:#0b0b0d;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f4f4f5;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0b0b0d;padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width:480px;background:#141418;border:1px solid #2a2a32;border-radius:16px;overflow:hidden;">
          <tr>
            <td style="padding:28px 28px 8px 28px;">
              <div style="font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:#a1a1aa;font-weight:600;">Copix</div>
              <h1 style="margin:12px 0 0;font-size:24px;line-height:1.25;font-weight:700;color:#fafafa;">Your sign-in code</h1>
              <p style="margin:12px 0 0;font-size:15px;line-height:1.55;color:#a1a1aa;">
                Enter this 6-digit code to continue. It expires in {{EXPIRES_MINUTES}} minutes.
              </p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:24px 28px;">
              <div style="display:inline-block;background:#0b0b0d;border:1px solid #3f3f46;border-radius:12px;padding:18px 28px;font-size:36px;letter-spacing:0.35em;font-weight:700;color:#fafafa;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;">
                {{CODE}}
              </div>
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 28px 28px;">
              <p style="margin:0;font-size:13px;line-height:1.5;color:#71717a;">
                If you didn’t request this, you can ignore this email. Never share this code with anyone — Copix staff will never ask for it.
              </p>
              <p style="margin:18px 0 0;font-size:12px;color:#52525b;">
                © {{YEAR}} Copix · proprietary software · free to use
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
